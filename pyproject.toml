[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecstore-lite"
version = "1.1.0"
description = "嵌入式 SQLite + NumPy 向量库：集合、混合检索、MMR、元数据过滤与离线哈希嵌入。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xiaowei" }]
keywords = ["vector", "embeddings", "sqlite", "semantic-search", "rag", "hybrid-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vecstore = "vecstore_lite.cli:main"

[project.urls]
Homepage = "https://github.com/k00000000/vecstore-lite"
Issues = "https://github.com/k00000000/vecstore-lite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
